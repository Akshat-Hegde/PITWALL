# Starter config. Every key is optional; the defaults are shown, and lines starting with # are examples.
# Installed hub: this file is C:\ProgramData\<product>\config\hub.toml; restart the hub after editing it.
# Source checkout: copy to config/hub.toml.

# data_dir = "data"                    # SQLite, track outlines, logs, recordings (relative to the cafe folder)

# The owner's /setup page overrides name, branding, PINs and opening hours via data/settings.json.
[cafe]
# name = "Sim Racing Cafe"

[cafe.branding]                        # CSS variables applied to the dashboard
# "--brand-accent" = "#e10600"

[network]
udp_host = "0.0.0.0"                   # all interfaces: works with Broadcast and direct-IP mode
udp_port = 20777                       # must match the UDP port set on every rig
udp_receive_buffer_bytes = 4194304     # 4 MB socket buffer for bursts
http_host = "0.0.0.0"
http_port = 8000

[recorder]
enabled_in_run = false                 # production: off (10 rigs ~ 7.5 GB/hour); `run --record` to override
enabled_in_listen = true               # debug `listen` mode: on; `listen --no-record` to override
max_file_mb = 256                      # rotate after this size
keep_files = 24                        # newest files kept; 0 = keep all
# directory = "D:/telemetry/recordings" # default: <data_dir>/recordings; may be on another drive
warn_free_gb = 5                       # warn when free space on the recordings drive drops below this
stop_free_gb = 1                       # stop recording (hub keeps running) below this
disk_check_interval_s = 30

[health]
summary_interval_s = 10
no_motion_after_s = 2                  # packets but no Motion -> "in menu / paused"
no_data_after_s = 5                    # nothing received -> "no data"

[dashboard]
frame_hz = 15                          # WebSocket updates per second (10-20)
steering_wheel_rotation_deg = 360       # lock-to-lock rotation of the TV's wheel graphic
# directory = "dashboard/dist"         # built dashboard; default <project>/dashboard/dist

[features]                             # switch optional features off (future licence tiers)
# moments = true                       # "now driving" and "record broken" full-screen moments
# battles = true                       # battle pop-ups
# podium = true                        # podium screen (hourly and on staff command)
# attract = true                       # attract mode after 60 s with nobody driving
# portrait = true                      # /portrait layout for vertical screens
# head_to_head = true                  # head to head, put on the TV from /staff
# onboard = true                       # the MULTIVIEW page (one tile per rig); off = LIVE only
# sharing = true                       # story card + QR code when a session ends
# challenges = true                    # weekly challenges
# events = true                        # corporate events with teams
# race_podium = true                   # race podium and race story cards (needs sharing = true)
# self_checkin = true                  # guests scan a QR sticker on the rig and type their own name

[checkin]
# blocked_words = ["somename"]         # extra words the self check-in name filter rejects (whole words)

[moments]
battle_margin_ms = 300                 # battle pop-up when two best laps are this close
podium_every_min = 60                  # podium at the end of every N minutes on the clock; 0 = staff only

[sounds]
enabled = false                        # session start and record sounds on the TV
volume = 0.6

[owner]
pin = ""                               # PIN for /owner (analytics); empty = the page stays locked
open_hour = 10                         # opening hours, for rig utilisation
close_hour = 22

[staff]
pin = ""                               # PIN for the /staff page (driver names); empty = no PIN

[leaderboard]
day_start_hour = 0                     # "today" starts at this hour (e.g. 5 for late-night sessions)

[map]                                  # how game coordinates are drawn on the TV map
flip_x = false                         # find the right values with the dashboard's ?map= option
flip_z = false                         # (docs/TEST_PLAN.md), then set them here
rotate_deg = 0

[backup]                               # nightly zip of laps, settings, branding and this file
enabled = true
# directory = "E:/pitwall-backups"     # default: a "backups" folder next to the data folder; a USB stick or synced folder is safer
hour = 4                               # local hour of the nightly backup
keep = 14                              # how many backups to keep

# Rigs are auto-detected by source IP and named "Rig 1", "Rig 2", ...
# Add entries to give them fixed names / colours.
# [[rigs]]
# ip = "192.168.1.21"
# name = "Rig A"
# colour = "#00d2be"

# Track name overrides by F1 trackId (keys are strings in TOML).
[track_names]
# "7" = "Silverstone GP"
