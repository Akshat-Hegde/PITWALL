<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{PRODUCT_NAME}}: phone test</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #111820; color: #eef3f6; font: 18px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 26em; padding: 24px 16px; text-align: center; }
  .mark { width: 72px; height: 72px; margin: 0 auto 16px; border-radius: 50%; display: flex; align-items: center;
          justify-content: center; font-size: 40px; font-weight: 800; }
  .ok .mark { background: #1fa855; }
  .self .mark { background: #3a4a58; }
  h1 { margin: 0 0 8px; font-size: 24px; }
  p { margin: 0; color: #b8c4cc; }
</style>
</head>
<body class="{{HELLO_KIND}}">
<main>
  <div class="mark" aria-hidden="true">{{HELLO_MARK}}</div>
  <h1>{{HELLO_TITLE}}</h1>
  <p>{{HELLO_TEXT}}</p>
</main>
</body>
</html>
