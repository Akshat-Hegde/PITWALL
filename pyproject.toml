[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simtelemetry"
version = "0.6.0"
description = "Local LAN telemetry hub and dashboard for sim racing cafes"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12",
    "pydantic>=2.6",
    "segno>=1.6",           # QR codes for story cards (pure Python, offline)
    "python-multipart>=0.0.9",  # logo upload on /setup
    "cryptography>=42",     # Ed25519 licence check (offline)
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]
build = ["pyinstaller>=6.6"]

[project.scripts]
simtelemetry = "simtelemetry.__main__:main"

[tool.setuptools.packages.find]
where = ["hub"]

[tool.setuptools.package-data]
simtelemetry = ["api/*.html", "tracks/*.json"]

[tool.pytest.ini_options]
testpaths = ["hub/tests", "factory/tests"]
asyncio_mode = "auto"
